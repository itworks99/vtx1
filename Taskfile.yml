# Taskfile for VTX1 project
# https://taskfile.dev

version: "3"

vars:
  PROJECT_NAME: "VTX1"
  DOCS_DIR: docs
  DIAGRAMS_DIR: "{{.DOCS_DIR}}/diagrams"
  WAVEFORMS_DIR: "{{.DOCS_DIR}}/waveforms"
  RELEASE_DIR: release
  OPENROAD_PATH: "D:/tools/OpenROAD"

set:
  - pipefail

tasks:
  default:
    cmds:
      - echo ""
      - echo "{{.PROJECT_NAME}} Build System"
      - echo ""
      - echo "Available tasks:"
      - echo "Task Name              Description"
      - echo "---------------------- -------------------------------------------------"
      - echo "PRIMARY TESTS:"
      - echo "  test-soc             Full SoC test - hello_world through the bus"
      - echo "  test-optimized       I2C-fixed optimized system test"
      - echo "  test-all             Run all test suites"
      - echo ""
      - echo "SPECIALIZED TESTS:"
      - echo "  test-decoder         Trit-native decoder vs assembler output"
      - echo "  test-core            hello_world on the RTL core"
      - echo "  bench                Tier A benchmarks in the ISA simulator"
      - echo ""
      - echo "DEBUG & VALIDATION:"
      - echo "  test-status          Quick system status check"
      - echo "  test-i2c-fix         Validate I2C state machine fix"
      - echo ""
      - echo "SIMULATION:"
      - echo "  simulate             Interactive system simulation"
      - echo ""
      - echo "SYNTHESIS & VALIDATION:"
      - echo "  check                Syntax checking"
      - echo "  synth                Synthesize design"
      - echo ""
      - echo "UTILITIES:"
      - echo "  clean                Clean build artifacts"
      - echo "  doc                  Generate documentation"
      - echo "  install              Install development tools"
    silent: true

  # Primary Test Tasks
  test-soc:
    desc: Full SoC test - executes hello_world through the bus matrix
    cmds:
      - task: os-mkdir-build
      - echo "Testing VTX1 Consolidated System..."
      - iverilog -g2012 -I src/common -I src/cpu -I src/memory -I src/system -I src/cache -I src/testbench -o build/vtx1_soc_test src/vtx1_soc.v src/testbench/tb_vtx1_soc.v src/common/*.v src/cpu/*.v src/memory/*.v src/system/*.v src/cache/*.v
      - vvp build/vtx1_soc_test
      - echo "VTX1 Consolidated system test completed. View waveforms with gtkwave vtx1_soc_test.vcd"

  test-optimized:
    desc: "Run the SoC test with I2C state fix validation"
    cmds:
      - task: os-clean-build
      - task: os-mkdir-build
      - cd src/assembler && go build -o ../../build/vtxasm .
      - ./build/vtxasm -f memh -o build/hello_world.memh src/assembler/examples/hello_world.asm
      - echo "Compiling VTX1 system with I2C state machine fixes..."
      - task: os-iverilog-optimized
      - task: os-run-optimized

  test-all:
    desc: Run all VTX1 tests
    cmds:
      - task: test-decoder
      - task: test-alu
      - task: test-core
      - task: test-optimized
      - echo "All VTX1 tests completed successfully"

  # Specialized Test Tasks
  test-decoder:
    desc: Verify trit-native decoder against real assembler output
    cmds:
      - task: os-mkdir-build
      - echo "Building VTX1 assembler..."
      - cd src/assembler && go build -o ../../build/vtxasm .
      - echo "Assembling hello_world.asm to a memory image..."
      - ./build/vtxasm -f memh -o build/hello_world.memh src/assembler/examples/hello_world.asm
      - echo "Running trit-native decoder testbench..."
      - iverilog -g2012 -I src/common -o build/vtx1_decoder_test src/cpu/vtx1_decoder.v src/testbench/tb_vtx1_decoder.v
      - vvp build/vtx1_decoder_test

  bench:
    desc: Run Tier A architecture benchmarks in the ISA simulator
    cmds:
      - task: os-mkdir-build
      - cd src/assembler && go build -o ../../build/vtxasm . && go build -o ../../build/vtxsim ./vtxsim
      - ./build/vtxasm -f memh -o build/dot_product.memh src/assembler/benchmarks/dot_product.asm
      - ./build/vtxasm -f memh -o build/sign_count.memh src/assembler/benchmarks/sign_count.asm
      - ./build/vtxasm -f memh -o build/abs_sum.memh src/assembler/benchmarks/abs_sum.asm
      - ./build/vtxasm -f memh -o build/sign_sum.memh src/assembler/benchmarks/sign_sum.asm
      - echo "=== dot_product (expect -107) ===" && ./build/vtxsim -dump 0x1200:1 build/dot_product.memh
      - echo "=== sign_count (expect 6/4/6) ===" && ./build/vtxsim -dump 0x1200:3 build/sign_count.memh
      - echo "=== abs_sum (expect 114) ===" && ./build/vtxsim -dump 0x1200:1 build/abs_sum.memh
      - echo "=== sign_sum (expect -2) ===" && ./build/vtxsim -dump 0x1200:1 build/sign_sum.memh
      - echo "=== RV32IM control core ===" && cd src/assembler && go test ./rvsim/ -run TestComparisonStats -v | grep static

  bench-rtl:
    desc: Cycle-level Tier A benchmarks on RTL - VTX1 vs PicoRV32
    cmds:
      - task: os-mkdir-build
      - cd src/assembler && go build -o ../../build/vtxasm . && go run ./rvsim/rvhex ../../build
      - ./build/vtxasm -f memh -o build/dot_product.memh src/assembler/benchmarks/dot_product.asm
      - ./build/vtxasm -f memh -o build/sign_count.memh src/assembler/benchmarks/sign_count.asm
      - ./build/vtxasm -f memh -o build/abs_sum.memh src/assembler/benchmarks/abs_sum.asm
      - ./build/vtxasm -f memh -o build/sign_sum.memh src/assembler/benchmarks/sign_sum.asm
      - iverilog -g2012 -I src/common -o build/vtx1_bench src/cpu/vtx1_decoder.v src/cpu/vtx1_alu.v src/cpu/vtx1_slot.v src/cpu/vtx1_core.v src/memory/vtx1_tcm.v src/testbench/tb_vtx1_bench.v
      - iverilog -g2012 -o build/picorv32_bench src/third_party/picorv32/picorv32.v src/testbench/tb_picorv32_bench.v
      - vvp build/vtx1_bench +img=build/dot_product.memh +nres=1 +exp0=-107 | grep RTL
      - vvp build/picorv32_bench +img=build/rv_dot_product.hex +nres=1 +exp0=-107 | grep Pico
      - vvp build/vtx1_bench +img=build/sign_count.memh +nres=3 +exp0=6 +exp1=4 +exp2=6 | grep RTL
      - vvp build/picorv32_bench +img=build/rv_sign_count.hex +nres=3 +exp0=6 +exp1=4 +exp2=6 | grep Pico
      - vvp build/vtx1_bench +img=build/abs_sum.memh +nres=1 +exp0=114 | grep RTL
      - vvp build/picorv32_bench +img=build/rv_abs_sum.hex +nres=1 +exp0=114 | grep Pico
      - vvp build/vtx1_bench +img=build/sign_sum.memh +nres=1 +exp0=-2 | grep RTL
      - vvp build/picorv32_bench +img=build/rv_sign_sum.hex +nres=1 +exp0=-2 | grep Pico

  sim-hello:
    desc: Assemble and run hello_world in the ISA simulator
    cmds:
      - task: os-mkdir-build
      - cd src/assembler && go build -o ../../build/vtxasm . && go build -o ../../build/vtxsim ./vtxsim
      - ./build/vtxasm -f memh -o build/hello_world.memh src/assembler/examples/hello_world.asm
      - ./build/vtxsim -dump 0x2000:16 build/hello_world.memh

  test-alu:
    desc: Verify the native balanced-ternary ALU against a binary reference
    cmds:
      - task: os-mkdir-build
      - iverilog -g2012 -I src/common -o build/vtx1_alu_test src/cpu/vtx1_alu.v src/testbench/tb_vtx1_alu.v
      - vvp build/vtx1_alu_test

  test-core:
    desc: Run hello_world on the trit-native RTL core (code-to-silicon loop)
    cmds:
      - task: os-mkdir-build
      - cd src/assembler && go build -o ../../build/vtxasm .
      - ./build/vtxasm -f memh -o build/hello_world.memh src/assembler/examples/hello_world.asm
      - iverilog -g2012 -I src/common -o build/vtx1_core_test src/cpu/vtx1_decoder.v src/cpu/vtx1_alu.v src/cpu/vtx1_slot.v src/cpu/vtx1_core.v src/memory/vtx1_tcm.v src/testbench/tb_vtx1_core.v
      - vvp build/vtx1_core_test

  # Debug and Issue Resolution Tasks
  test-i2c-fix:
    desc: Test I2C controller state machine fix
    cmds:
      - task: os-mkdir-build
      - echo "Testing I2C controller with fixed state constants..."
      - iverilog -g2012 -I src/common -o build/i2c_fix_test src/system/i2c_controller.v src/common/vtx1_state_constants.v src/common/vtx1_error_macros.v src/common/ternary_*.v src/common/vtx1_clock_divider.v
      - echo "I2C controller compilation successful - state constants fixed"

  test-status:
    desc: "Quick system status check and Error LED validation"
    cmds:
      - echo "=== VTX1 System Status Check ==="
      - echo "Available testbenches:"
      - task: os-list-testbenches
      - echo "Running quick SoC test..."
      - task: test-optimized

  # Simulation
  simulate:
    desc: Interactive simulation with GTKWave
    cmds:
      - task: test-soc
      - gtkwave vtx1_soc_test.vcd

  # Synthesis & Validation
  check:
    desc: Check VTX1 SoC syntax
    cmds:
      - echo "Checking VTX1 Consolidated System syntax..."
      - iverilog -g2012 -I src/common -I src/cpu -I src/memory -I src/system -t null src/vtx1_soc.v src/common/*.v src/cpu/*.v src/memory/*.v src/system/*.v src/cache/*.v
      - echo "VTX1 Consolidated syntax check completed"

  synth:
    desc: Synthesize the trit-native CPU (decoder + ALU + core) with Yosys
    cmds:
      - task: os-mkdir-build
      - echo "Synthesizing the trit-native CPU..."
      - yosys -p "read_verilog -I src/common src/cpu/vtx1_decoder.v src/cpu/vtx1_alu.v src/cpu/vtx1_slot.v src/cpu/vtx1_core.v; synth -top vtx1_core; stat; write_json build/vtx1_core_synth.json" | tail -35
      - echo "CPU synthesis completed. Netlist in build/vtx1_core_synth.json"

  synth-soc:
    desc: Synthesize the full SoC with Yosys (slow; tens of minutes)
    cmds:
      - task: os-mkdir-build
      # chparam shrinks the TCM array to 256 words for the generic synth
      # smoke test: Yosys' generic flow maps RAMs to flip-flops (no RAM
      # target library), and FF-mapping the full 4096x36 array validates
      # no additional logic. On a real flow the array is a RAM macro.
      - yosys -p "read_verilog -I src/common -I src/cpu -I src/memory -I src/system -I src/cache src/vtx1_soc.v src/common/ternary_arithmetic.v src/common/ternary_constants.v src/common/vtx1_state_constants.v src/common/vtx1_interfaces.v src/common/vtx1_error_macros.v src/common/ternary_logic.v src/common/ternary_encoding.v src/cpu/vtx1_decoder.v src/cpu/vtx1_alu.v src/cpu/vtx1_slot.v src/cpu/vtx1_core.v src/memory/memory_controller.v src/memory/vtx1_tcm.v src/system/uart_controller.v src/system/spi_controller.v src/system/i2c_controller.v src/system/gpio_controller.v src/system/dma_controller.v src/system/debug_controller.v src/system/cpu_adapter.v src/system/bus_matrix.v src/cache/cache_controller.v; chparam -set ADDR_BITS 8 vtx1_tcm; synth -top vtx1_soc; write_verilog build/vtx1_soc_synth.v; write_json build/vtx1_soc_synth.json"

  # Utilities
  clean:
    desc: Clean build artifacts
    cmds:
      - task: os-clean-build
      - echo "Build artifacts cleaned"

  doc:
    desc: Generate documentation in PDF
    cmds:
      - echo "Generating documentation..."
      - task: os-doc-arch
      - task: os-doc-asm
      - echo "Documentation generated in {{.RELEASE_DIR}}"

  os-mkdir-build:
    desc: Create build directory (OS aware)
    cmds:
      - |
        if [ "${OS}" = "windows" ]; then
          powershell -Command "New-Item -ItemType Directory -Force -Path build | Out-Null"
        else
          mkdir -p build
        fi
    silent: true

  os-clean-build:
    desc: Clean build directory and artifacts (OS aware)
    cmds:
      - |
        if [ "${OS}" = "windows" ]; then
          powershell -Command "Remove-Item -Recurse -Force -Path build -ErrorAction SilentlyContinue"
          powershell -Command "Remove-Item -Force -Path *.vcd -ErrorAction SilentlyContinue"
          powershell -Command "Remove-Item -Force -Path *.out -ErrorAction SilentlyContinue"
        else
          rm -rf build
          rm -f *.vcd
          rm -f *.out
        fi
    silent: true

  os-list-testbenches:
    desc: List testbenches (OS aware)
    cmds:
      - |
        if [ "${OS}" = "windows" ]; then
          powershell -Command "Get-ChildItem src\testbench\*.v | Select-Object Name, Length | Format-Table -AutoSize"
        else
          ls -lh src/testbench/*.v
        fi
    silent: true

  os-iverilog-optimized:
    desc: Compile optimized test (OS aware)
    cmds:
      - |
        if [ "${OS}" = "windows" ]; then
          powershell -Command "iverilog -I src\common -I src\cache -o build\vtx1_optimized_test src\vtx1_soc.v src\testbench\tb_vtx1_soc.v src\common\*.v src\cpu\*.v src\memory\*.v src\system\*.v src\cache\*.v"
        else
          iverilog -I src/common -I src/cache -o build/vtx1_optimized_test src/vtx1_soc.v src/testbench/tb_vtx1_soc.v src/common/*.v src/cpu/*.v src/memory/*.v src/system/*.v src/cache/*.v
        fi
    silent: true

  os-run-optimized:
    desc: Run optimized test (OS aware)
    cmds:
      - |
        if [ "${OS}" = "windows" ]; then
          powershell -Command "if ($LASTEXITCODE -eq 0) { Write-Host 'Running optimized test with I2C fixes...' -ForegroundColor Green; .\build\vtx1_optimized_test } else { Write-Host 'Compilation failed' -ForegroundColor Red }"
        else
          ./build/vtx1_optimized_test || echo "Compilation failed"
        fi
    silent: true

  os-doc-arch:
    desc: Generate architecture PDF (OS aware)
    cmds:
      - |
        if [ "${OS}" = "windows" ]; then
          asciidoctor-pdf --theme docs/Architecture.yml -r asciidoctor-diagram -o "{{.RELEASE_DIR}}/vtx1-architecture.pdf" docs/Architecture.adoc
        else
          export GEM_HOME="$HOME/.gem"; export PATH="$GEM_HOME/ruby/$(ruby -e 'print RUBY_VERSION')/bin:$PATH"; \
          asciidoctor-pdf --version; \
          asciidoctor-pdf --theme docs/Architecture.yml -r asciidoctor-diagram -o "{{.RELEASE_DIR}}/vtx1-architecture.pdf" docs/Architecture.adoc
        fi
    silent: true

  os-doc-asm:
    desc: Generate assembler PDF (OS aware)
    cmds:
      - |
        if [ "${OS}" = "windows" ]; then
          asciidoctor-pdf --theme src/assembler/docs/assembler.yml -r asciidoctor-diagram -o "{{.RELEASE_DIR}}/vtx1-assembler.pdf" src/assembler/docs/assembler.adoc
        else
          export GEM_HOME="$HOME/.gem"; export PATH="$GEM_HOME/ruby/$(ruby -e 'print RUBY_VERSION')/bin:$PATH"; \
          asciidoctor-pdf --version; \
          asciidoctor-pdf --theme src/assembler/docs/assembler.yml -r asciidoctor-diagram -o "{{.RELEASE_DIR}}/vtx1-assembler.pdf" src/assembler/docs/assembler.adoc
        fi
    silent: true
